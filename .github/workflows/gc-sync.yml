name: Sync relay (GetCourse + LiveDune)
on:
  schedule:
    - cron: "0 1,7,13,19 * * *"   # 4 раза в день (UTC)
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: LiveDune stats
        run: python tools/livedune_relay.py
        env:
          LIVEDUNE_TOKEN: ${{ secrets.LIVEDUNE_TOKEN }}
          LD_MAP: ${{ secrets.LD_MAP }}
          PA_URL: ${{ secrets.PA_URL }}
          PA_INGEST_TOKEN: ${{ secrets.PA_INGEST_TOKEN }}
          DAYS: "3"
      - name: Telegram notifications
        run: python tools/notify_relay.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PA_URL: ${{ secrets.PA_URL }}
          PA_INGEST_TOKEN: ${{ secrets.PA_INGEST_TOKEN }}
      - name: GetCourse export
        run: python tools/gc_relay.py
        env:
          GC_ACCOUNT: https://syrover.com
          GC_API_KEY: ${{ secrets.GC_API_KEY }}
          PA_URL: ${{ secrets.PA_URL }}
          PA_INGEST_TOKEN: ${{ secrets.PA_INGEST_TOKEN }}
          DAYS: "5"
